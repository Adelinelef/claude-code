<style>
  body { margin: 0; }
  .container { max-width: 1200px; margin: 0 auto; }
  html { scroll-behavior: smooth; }
  a.phone-link:hover { background: var(--js-ink-100); border-radius: var(--r-md); }
  .anchor-link { color: var(--fg2); text-decoration: none; transition: color 160ms ease; padding: 6px 2px; }
  .anchor-link:hover { color: var(--fg1); }

    .anchor-nav { display: none !important; }

    .juris-grid { grid-template-columns: 1fr !important; }
    .alc-grid { grid-template-columns: 1fr !important; }
    .steps-row { grid-template-columns: 1fr !important; }
    .step-arrow { transform: rotate(90deg); padding: 12px 0 !important; justify-self: center; }
    .why-grid { grid-template-columns: 1fr !important; }
    .reasons-grid { grid-template-columns: 1fr !important; }
    .faq-flash { grid-template-columns: 1fr !important; }
    .contact-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .phone-number { display: none; }
  }
  @media (max-width: 560px) {
    .reassurance-grid { grid-template-columns: 1fr !important; }
  }
